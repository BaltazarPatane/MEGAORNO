name: Inspect MEGAORNO version packages
on:
  push:
    branches:
      - maintenance/organize-versions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archives without executing archive contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, collections
          for path in sorted(pathlib.Path('dist').glob('*.zip')):
              print('\n===', path, '===')
              with zipfile.ZipFile(path) as z:
                  infos=z.infolist()
                  print('total entries',len(infos))
                  for info in infos[:160]:
                      print(info.filename, info.file_size)
                  if len(infos)>160: print('...remaining',len(infos)-160)
          PY
