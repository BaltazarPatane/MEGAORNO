name: Organize historical source versions
on:
  push:
    branches: [maintenance/organize-versions]
permissions:
  contents: write
jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Extract versioned source into readable branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MEGAORNO maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import zipfile,pathlib,subprocess,tempfile,shutil,os
          root=pathlib.Path.cwd()
          archives={v:(root/'dist'/f'MEGAORNO_{v}.zip').read_bytes() for v in ('3.0','3.1','3.2')}
          # Capture bytes once before switching worktrees, never execute anything in the archives.
          base={'3.0':'2017bfbc522d6bf380089700afb1fbc09431ab01','3.1':'38261d429c964c6d90a79d0465c213d923df5625','3.2':'5b14847739b4d5295f285bcef3eb33b4f7edff37'}
          def git(*args,cwd=None):
              return subprocess.run(['git',*args],cwd=cwd or root,check=True,stdout=subprocess.PIPE,text=True).stdout.strip()
          def populate(work,version):
              import io
              (work/'dist').mkdir(exist_ok=True)
              shutil.rmtree(work/'dist')
              with zipfile.ZipFile(io.BytesIO(archives[version])) as z:
                  names=[i for i in z.infolist() if not i.is_dir()]
                  for ent in names:
                      parts=pathlib.PurePosixPath(ent.filename).parts
                      if (len(parts)<2 or parts[0]!=f'MEGAORNO_{version}' or
                          any(x in ('..','.','') for x in parts) or
                          (ent.external_attr>>16)&0o170000==0o120000):
                          raise RuntimeError('Unsafe archive entry '+ent.filename)
                      rel=pathlib.Path(*parts[1:])
                      dest=work/rel
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(ent))
              (work/'docs'/'img').mkdir(parents=True,exist_ok=True)
              (work/'docs'/'img'/'.gitkeep').write_text('')
              (work/'.gitignore').write_text('__pycache__/\n*.py[cod]\n.venv/\nvenv/\n.pytest_cache/\n*.log\n*.tmp\n')
              (work/'VERSION').write_text(f'{version}\n')
              if (work/'LEEME.md').exists():
                  (work/'README_VERSION.md').write_text((work/'LEEME.md').read_text(encoding='utf-8-sig'))
              return len(names)
          with tempfile.TemporaryDirectory() as temp:
              tmp=pathlib.Path(temp)
              for v in ('3.0','3.1','3.2'):
                  branch=f'version/v{v}'
                  subprocess.run(['git','worktree','add','--detach',str(tmp/v),base[v]],cwd=root,check=True)
                  p=tmp/v
                  count=populate(p,v)
                  git('add','-A',cwd=p)
                  git('commit','-m',f'release: expand MEGAORNO {v} source files ({count} original archive entries)',cwd=p)
                  sha=git('rev-parse','HEAD',cwd=p)
                  git('push','origin',f'{sha}:refs/heads/{branch}',cwd=p)
                  print('Published',branch,sha,'files',count)
              # Make main track the latest source while preserving its history and complete README.
              git('fetch','origin','main')
              subprocess.run(['git','worktree','add','--detach',str(tmp/'latest'),'origin/main'],cwd=root,check=True)
              p=tmp/'latest'
              count=populate(p,'3.2')
              git('add','-A',cwd=p)
              git('commit','-m',f'refactor: expose v3.2 application sources instead of binary ZIP packages',cwd=p)
              sha=git('rev-parse','HEAD',cwd=p)
              git('push','origin',f'{sha}:refs/heads/main',cwd=p)
              print('Published main',sha,'files',count)
          PY
